<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>stopwatch4two</title>

  <!-- Android PWA & Home Screen App Configuration -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#09090b">
  <meta name="mobile-web-app-capable" content="yes">
  <link id="favicon" rel="icon" type="image/png" href="icon.png">

  <!-- Google Fonts for consistent rendering on Android & Desktop -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@700&family=Dancing+Script:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Core Dark Theme Variables */
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --muted: #71717a;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --glow-color: rgba(167, 139, 250, 0.22);
      --glow-text: #e9d5ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      padding: max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-title {
      font-family: 'Dancing Script', cursive;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.02em;
      margin-bottom: -6px;
    }

    /* One-Time Notification Permission Prompt (Only shown in standalone PWA mode) */
    .notify-prompt {
      background: #18181b;
      border: 1px solid #3f3f46;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.82rem;
      color: #d4d4d8;
    }

    .notify-prompt.hidden {
      display: none;
    }

    .notify-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-link-user {
      padding: 6px 10px;
      font-size: 0.78rem;
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(167, 139, 250, 0.4);
      color: #e9d5ff;
      border-radius: 6px;
    }

    .btn-dismiss {
      padding: 4px 8px;
      font-size: 0.85rem;
      background: transparent;
      border: none;
      color: var(--muted);
    }

    /* Illuminated 30-Minute Notes Banner */
    .notes-stage {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .notes-stage:empty {
      display: none;
    }

    .illuminated-note {
      position: relative;
      padding: 12px 18px;
      border-radius: 14px;
      background: radial-gradient(circle at center, rgba(139, 92, 246, 0.16) 0%, rgba(18, 18, 21, 0.9) 100%);
      border: 1px solid rgba(167, 139, 250, 0.35);
      box-shadow: 0 0 24px var(--glow-color), inset 0 0 12px rgba(167, 139, 250, 0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      animation: pulseGlow 4s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(167, 139, 250, 0.18), inset 0 0 10px rgba(167, 139, 250, 0.06); }
      50% { box-shadow: 0 0 30px rgba(167, 139, 250, 0.32), inset 0 0 16px rgba(167, 139, 250, 0.12); }
    }

    .note-content {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .note-author {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #a78bfa;
      flex-shrink: 0;
    }

    .note-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--glow-text);
      background: transparent;
      border: none;
      box-shadow: none;
      text-shadow: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-timer {
      font-family: 'Chivo Mono', monospace;
      font-size: 0.72rem;
      color: #a1a1aa;
      width: 3ch;
      text-align: right;
      flex-shrink: 0;
    }

    /* Right-side container holding the circle-tick button and remaining minutes */
    .note-meta {
      display: flex;
      align-items: center;
      gap: 12.5px;
      flex-shrink: 0;
    }

    /* Subtle violet circle-tick button (~20% smaller) matching the illuminated note card */
    .note-tick {
      width: 18px;
      height: 18px;
      padding: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(139, 92, 246, 0.1);
      border: 1.5px solid rgba(167, 139, 250, 0.4);
      color: rgba(216, 180, 254, 0.55);
      cursor: pointer;
      transition: background-color 0.25s ease, border-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .note-tick svg {
      width: 10px;
      height: 10px;
      stroke-width: 2.6;
    }

    /* Glowing green state when acknowledged */
    .note-tick.seen {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--accent-green);
      color: var(--accent-green);
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.45), inset 0 0 6px rgba(34, 197, 94, 0.2);
    }

    /* Clean Stopwatch Cards */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
    }

    .user-label {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .time-display-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 10px 0 20px;
    }

    .time-display {
      font-family: 'Chivo Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fafafa;
    }

    /* Live Green Status Indicator */
    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background-color: #27272a;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }

    .status-dot.active {
      background-color: var(--accent-green);
      box-shadow: 0 0 12px var(--accent-green);
    }

    /* Stopwatch Action Buttons */
    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #18181b;
      color: var(--text);
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
    }

    button:hover:not(:disabled) { opacity: 0.85; }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-start { background: var(--accent-green); color: #000; border: none; }
    .btn-stop { background: var(--accent-red); color: #fff; border: none; }
    .btn-save { background: var(--accent-blue); color: #fff; border: none; }

    /* Compact 30-Minute Note Input Row */
    .note-input-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #1f1f23;
    }

    .note-input {
      flex: 1;
      min-width: 0;
      background: #18181b;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .note-input:focus {
      border-color: #7c3aed;
    }

    .note-input:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-note {
      padding: 8px 14px;
      font-size: 0.8rem;
      background: #27272a;
      border: 1px solid #3f3f46;
    }

    /* Saved History Log Card */
    .history-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .history-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #18181b;
      border-radius: 8px;
      font-size: 0.85rem;
    }

    .history-item .name { font-weight: 600; }
    .history-item .duration { font-family: 'Chivo Mono', monospace; font-variant-numeric: tabular-nums; font-weight: 700; color: #a1a1aa; }
    .history-item .timestamp { font-size: 0.75rem; color: var(--muted); }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="app-title">stopwatch4two</h1>

    <!-- One-time setup prompt: appears only inside installed PWA until linked -->
    <div class="notify-prompt hidden" id="notify-prompt">
      <span>Enable alerts for:</span>
      <div class="notify-actions">
        <button class="btn-link-user" onclick="setupNotifications('userA')">Pratishtha</button>
        <button class="btn-link-user" onclick="setupNotifications('userB')">Abhi</button>
        <button class="btn-dismiss" onclick="dismissPrompt()" title="Dismiss">✕</button>
      </div>
    </div>

    <!-- Illuminated Active 30m Notes Banner -->
    <div class="notes-stage" id="notes-stage"></div>

    <!-- Pratishtha's Card -->
    <div class="card">
      <div class="user-label">Pratishtha</div>
      <div class="time-display-container">
        <div class="time-display" id="time-userA">00:00:00</div>

      </div>
      <div class="controls">
        <button class="btn-start" onclick="start('userA', 'Pratishtha')">Start</button>
        <button class="btn-stop" onclick="stop('userA')">Stop</button>

      </div>
      <form class="note-input-row" onsubmit="sendNote(event, 'userA', 'Pratishtha')">
        <input type="text" class="note-input" id="input-userA" maxlength="25" placeholder="Drop a 30m note (25 max)..." autocomplete="off">
        <button type="submit" class="btn-note" id="btn-note-userA">Send</button>
      </form>
    </div>

    <!-- Abhi's Card -->
    <div class="card">
      <div class="user-label">Abhi</div>
      <div class="time-display-container">
        <div class="time-display" id="time-userB">00:00:00</div>
        <div class="status-dot" id="dot-userB" title="Status: Off"></div>
      </div>
      <div class="controls">
        <button class="btn-start" onclick="start('userB', 'Abhi')">Start</button>
        <button class="btn-stop" onclick="stop('userB')">Stop</button>
        <button onclick="reset('userB')">Reset</button>
        <button class="btn-save" onclick="save('userB', 'Abhi')">Log</button>
      </div>
      <form class="note-input-row" onsubmit="sendNote(event, 'userB', 'Abhi')">
        <input type="text" class="note-input" id="input-userB" maxlength="25" placeholder="Drop a 30m note (25 max)..." autocomplete="off">
        <button type="submit" class="btn-note" id="btn-note-userB">Send</button>
      </form>
    </div>

    <!-- Saved Logs Card -->
    <div class="history-card">
      <div class="history-title">Saved Logs</div>
      <div class="history-list" id="history-container">
        <div style="font-size: 0.85rem; color: var(--muted); text-align: center; padding: 12px;">No logged times yet</div>
      </div>
    </div>
  </div>

  <!-- Firebase App, Realtime Database, and Cloud Messaging SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>

  <script>
    // =========================================================================
    // 1. CONFIGURATION (PASTE YOUR REAL KEYS & CLOUDFLARE WORKER URL HERE)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyAG8e7n7-fH1KfY8jDGZ1sdXQmfilXwE9k",
      authDomain: "stopwatch4two.firebaseapp.com",
      databaseURL: "https://stopwatch4two-default-rtdb.firebaseio.com",
      projectId: "stopwatch4two",
      storageBucket: "stopwatch4two.firebasestorage.app",
      messagingSenderId: "547414457103",
      appId: "1:547414457103:web:9f470fc673e229f80cdc7a"
    };

    const VAPID_KEY = "BMuSPbcK5dWTE0l_w2eUlLw8_aW295VzTM9-mJVxhFQ7YuiYEtO6jvLEp3yguw0suqp-M--KmaT8OePSodB0pkQ";
    const WORKER_URL = "https://stopwatch-push.abhishekbosegd.workers.dev/";

    // =========================================================================
    // 2. ROUNDED BROWSER TAB FAVICON (Keeps Android home screen icon unchanged)
    // =========================================================================
    (function roundFavicon() {
      const img = new Image();
      img.src = 'icon.png';
      img.onload = () => {
        const size = 64;
        const radius = 16;
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');

        ctx.beginPath();
        ctx.moveTo(radius, 0);
        ctx.lineTo(size - radius, 0);
        ctx.quadraticCurveTo(size, 0, size, radius);
        ctx.lineTo(size, size - radius);
        ctx.quadraticCurveTo(size, size, size - radius, size);
        ctx.lineTo(radius, size);
        ctx.quadraticCurveTo(0, size, 0, size - radius);
        ctx.lineTo(0, radius);
        ctx.quadraticCurveTo(0, 0, radius, 0);
        ctx.closePath();
        ctx.clip();

        ctx.drawImage(img, 0, 0, size, size);
        document.getElementById('favicon').href = canvas.toDataURL('image/png');
      };
    })();

    // =========================================================================
    // 3. FIREBASE & ANDROID PUSH NOTIFICATION SETUP (Multi-device supported)
    // =========================================================================
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const messaging = firebase.messaging();

    let swRegistration = null;

    if ('serviceWorker' in navigator && 'Notification' in window) {
      navigator.serviceWorker.register('./firebase-messaging-sw.js')
        .then(async (reg) => {
          swRegistration = reg;
          await checkNotificationState();
        })
        .catch((err) => console.error('Service Worker error:', err));
    }

    // Show native system notification when app is open in foreground
    messaging.onMessage((payload) => {
      if (Notification.permission === 'granted' && payload.notification) {
        new Notification(payload.notification.title, {
          body: payload.notification.body || '',
          badge: 'badge.png',
          icon: 'transparent.png'
        });
      }
    });

    // Only prompt inside the installed standalone PWA; silently keep token synced afterward
    async function checkNotificationState() {
      const linkedUser = localStorage.getItem('linkedNotifyUser');
      const dismissed = localStorage.getItem('notifyPromptDismissed');
      const promptEl = document.getElementById('notify-prompt');
      const isInstalledApp = window.matchMedia('(display-mode: standalone)').matches;

      if (Notification.permission === 'granted' && linkedUser) {
        promptEl.classList.add('hidden');
        try {
          const token = await messaging.getToken({
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration: swRegistration
          });
          if (token) await db.ref(`tokens/${linkedUser}/${token}`).set(true);
        } catch (e) {
          console.error('Silent token refresh failed:', e);
        }
      } else if (isInstalledApp && Notification.permission !== 'denied' && !dismissed) {
        promptEl.classList.remove('hidden');
      }
    }

    async function setupNotifications(user) {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') {
          dismissPrompt();
          return;
        }

        if (!swRegistration) {
          swRegistration = await navigator.serviceWorker.ready;
        }

        const token = await messaging.getToken({
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: swRegistration
        });

        if (token) {
          await db.ref(`tokens/${user}/${token}`).set(true);
          localStorage.setItem('linkedNotifyUser', user);
          document.getElementById('notify-prompt').classList.add('hidden');
        }
      } catch (err) {
        console.error('Notification setup error:', err);
      }
    }

    function dismissPrompt() {
      localStorage.setItem('notifyPromptDismissed', 'true');
      document.getElementById('notify-prompt').classList.add('hidden');
    }

    // =========================================================================
    // 4. REALTIME STOPWATCH SYNC, OVERTAKE DETECTION & START COOLDOWNS
    // =========================================================================
    const timers = {
      userA: { running: false, start: 0, accumulated: 0 },
      userB: { running: false, start: 0, accumulated: 0 }
    };

    // Wait for timers, leader, AND serverTimeOffset before checking overtakes
    const initialSync = {
      userA: false,
      userB: false,
      leader: false,
      offset: false
    };

    const activeNotes = {
      userA: null,
      userB: null
    };

    const startCooldowns = {
      userA: 0,
      userB: 0
    };

    let currentLeader = null;

    const THIRTY_MINS_MS = 30 * 60 * 1000;
    let serverOffset = 0;
    let rafId = null;

    db.ref('.info/serverTimeOffset').on('value', snap => {
      serverOffset = snap.val() || 0;
      initialSync.offset = true;
      updateNotesUI();
    });

    function getServerNow() {
      return Date.now() + serverOffset;
    }

    function getCurrentTotal(user, now = getServerNow()) {
      let total = timers[user].accumulated;
      if (timers[user].running) {
        total += Math.max(0, now - timers[user].start);
      }
      return total;
    }

    function formatTime(ms) {
      const totalSec = Math.floor(Math.max(0, ms) / 1000);
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // Sync leader state from Firebase (never overwrite it backwards on page load)
    db.ref('leader').on('value', snap => {
      currentLeader = snap.exists() ? snap.val() : 'none';
      initialSync.leader = true;
      checkOvertake(getServerNow());
    });

    // Evaluates whether a trailing watch has genuinely overtaken a stopped leading watch
    function checkOvertake(now) {
      if (!initialSync.userA || !initialSync.userB || !initialSync.leader || !initialSync.offset) return;

      const secA = Math.floor(getCurrentTotal('userA', now) / 1000);
      const secB = Math.floor(getCurrentTotal('userB', now) / 1000);

      if (secA === secB) return; // Tied — neither has surpassed the other yet

      const aheadUser = secA > secB ? 'userA' : 'userB';
      const behindUser = secA > secB ? 'userB' : 'userA';
      const secBehind = Math.min(secA, secB);

      // Case 1: Nobody was leading before (e.g., starting from 00:00:00).
      // Record the initial leader silently without sending an overtake notification.
      if (currentLeader === 'none') {
        db.ref('leader').transaction(val => {
          if (val === null || val === 'none') return aheadUser;
          return;
        });
        return;
      }

      // Case 2: Genuine overtake — only triggers when:
      // 1. The user now ahead was previously behind (currentLeader === behindUser)
      // 2. The overtaker's watch is actively running (timers[aheadUser].running)
      // 3. The previous leader's watch is currently turned OFF (!timers[behindUser].running)
      // 4. The previous leader actually had > 0 seconds on their watch (secBehind > 0)
      if (
        currentLeader === behindUser &&
        timers[aheadUser].running &&
        !timers[behindUser].running &&
        secBehind > 0
      ) {
        db.ref('leader').transaction(val => {
          if (val === behindUser) return aheadUser;
          return; // Abort if another device already claimed this overtake
        }, (error, committed) => {
          if (committed && WORKER_URL && !WORKER_URL.includes('YOUR_SUBDOMAIN')) {
            fetch(WORKER_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'overtake',
                senderUser: aheadUser,
                recipientUser: behindUser // Notify the previous leader who now has less time
              })
            }).catch(err => console.error('Overtake push trigger failed:', err));
          }
        });
      }
    }

    function renderLoop() {
      const now = getServerNow();
      let anyRunning = false;
      let digitChanged = false;

      ['userA', 'userB'].forEach(user => {
        if (timers[user].running) anyRunning = true;
        const total = getCurrentTotal(user, now);
        const el = document.getElementById(`time-${user}`);
        const formatted = formatTime(total);
        if (el.innerText !== formatted) {
          el.innerText = formatted;
          digitChanged = true;
        }
      });

      // Check for an overtake whenever a displayed second ticks over
      if (digitChanged) {
        checkOvertake(now);
      }

      if (anyRunning) {
        rafId = requestAnimationFrame(renderLoop);
      } else {
        rafId = null;
      }
    }

    ['userA', 'userB'].forEach(user => {
      db.ref(`timers/${user}`).on('value', snap => {
        const val = snap.val() || { running: false, start: 0, accumulated: 0 };
        timers[user].running = val.running;
        timers[user].start = val.start;
        timers[user].accumulated = val.accumulated;
        initialSync[user] = true;

        const dot = document.getElementById(`dot-${user}`);

        if (val.running) {
          dot.classList.add('active');
          dot.setAttribute('title', 'Status: Running');
          if (!rafId) rafId = requestAnimationFrame(renderLoop);
        } else {
          dot.classList.remove('active');
          dot.setAttribute('title', 'Status: Off');
          document.getElementById(`time-${user}`).innerText = formatTime(val.accumulated);
        }

        checkOvertake(getServerNow());
      });

      db.ref(`notes/${user}`).on('value', snap => {
        activeNotes[user] = snap.val();
        updateNotesUI();
      });

      db.ref(`startCooldowns/${user}`).on('value', snap => {
        startCooldowns[user] = snap.val() || 0;
      });
    });

    // =========================================================================
    // 5. 30-MINUTE ILLUMINATED NOTES & PUSH NOTIFICATION DISPATCH
    // =========================================================================
    // Toggles the green circle-tick state on an active 30-minute note
    function toggleNoteSeen(user) {
      const note = activeNotes[user];
      if (!note) return;
      db.ref(`notes/${user}/seen`).set(!note.seen);
    }

    function updateNotesUI() {
      const now = getServerNow();
      const stage = document.getElementById('notes-stage');
      stage.innerHTML = '';

      ['userA', 'userB'].forEach(user => {
        const note = activeNotes[user];
        const input = document.getElementById(`input-${user}`);
        const btn = document.getElementById(`btn-note-${user}`);

        if (note && note.expiresAt > now) {
          const remainingMs = note.expiresAt - now;
          const minsLeft = Math.ceil(remainingMs / 60000);

          input.disabled = true;
          btn.disabled = true;
          input.placeholder = `Locked (${minsLeft}m left)`;

          const card = document.createElement('div');
          card.className = 'illuminated-note';

          const content = document.createElement('div');
          content.className = 'note-content';

          const author = document.createElement('span');
          author.className = 'note-author';
          author.textContent = note.name + ':';

          const text = document.createElement('span');
          text.className = 'note-text';
          text.textContent = note.text;

          content.appendChild(author);
          content.appendChild(text);

          // Right-side wrapper: circle-tick button before the remaining time
          const meta = document.createElement('div');
          meta.className = 'note-meta';

          const tickBtn = document.createElement('button');
          tickBtn.type = 'button';
          tickBtn.className = note.seen ? 'note-tick seen' : 'note-tick';
          tickBtn.title = note.seen ? 'Acknowledged' : 'Mark as seen';
          tickBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
          tickBtn.onclick = () => toggleNoteSeen(user);

          const timer = document.createElement('span');
          timer.className = 'note-timer';
          timer.textContent = `${minsLeft}m`;

          meta.appendChild(tickBtn);
          meta.appendChild(timer);

          card.appendChild(content);
          card.appendChild(meta);
          stage.appendChild(card);
        } else {
          input.disabled = false;
          btn.disabled = false;
          input.placeholder = 'Drop a 30m note (25 max)...';

          if (note && note.expiresAt <= now) {
            db.ref(`notes/${user}`).remove();
          }
        }
      });
    }

    setInterval(updateNotesUI, 5000);

    // Enforce 25-character limit live on every keystroke
    document.querySelectorAll('.note-input').forEach((input) => {
      input.addEventListener('input', () => {
        const chars = Array.from(input.value);
        if (chars.length > 25) {
          input.value = chars.slice(0, 25).join('');
        }
      });
    });

    function sendNote(event, user, name) {
      event.preventDefault();
      const now = getServerNow();

      if (activeNotes[user] && activeNotes[user].expiresAt > now) return;

      const input = document.getElementById(`input-${user}`);
      const raw = input.value.trim();
      const text = Array.from(raw).slice(0, 25).join('');
      if (!text) return;

      input.value = '';

      db.ref(`notes/${user}`).set({
        name: name,
        text: text,
        expiresAt: now + THIRTY_MINS_MS,
        seen: false
      });

      const recipientUser = user === 'userA' ? 'userB' : 'userA';
      if (WORKER_URL && !WORKER_URL.includes('YOUR_SUBDOMAIN')) {
        fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'note',
            senderUser: user,
            senderName: name,
            recipientUser: recipientUser,
            noteText: text
          })
        }).catch(err => console.error('Note push trigger failed:', err));
      }
    }

    // =========================================================================
    // 6. SAVED LOGS & STOPWATCH CONTROLS
    // =========================================================================
    db.ref('history').limitToLast(20).on('value', snap => {
      const container = document.getElementById('history-container');
      const data = snap.val();
      if (!data) {
        container.innerHTML = '<div style="font-size: 0.85rem; color: var(--muted); text-align: center; padding: 12px;">No logged times yet</div>';
        return;
      }

      container.innerHTML = '';
      Object.values(data).reverse().forEach(row => {
        const item = document.createElement('div');
        item.className = 'history-item';
        item.innerHTML = `
          <div><span class="name">${row.name}</span> <span class="timestamp">${row.date}</span></div>
          <div class="duration">${row.duration}</div>
        `;
        container.appendChild(item);
      });
    });

    function start(user, name) {
      if (timers[user].running) return;
      const now = getServerNow();
      const acc = timers[user].accumulated;
      const alignedStart = Math.floor((now - acc) / 1000) * 1000 + acc;

      db.ref(`timers/${user}`).set({
        running: true,
        start: alignedStart,
        accumulated: acc
      });

      // Trigger "CAN'T LET 'USER' WIN!!" push alert only if:
      // 1. 30 minutes have passed since the last start alert
      // 2. The recipient's stopwatch is NOT already running
      const recipientUser = user === 'userA' ? 'userB' : 'userA';
      const isCoolingDown = now - startCooldowns[user] < THIRTY_MINS_MS;
      const isRecipientAlreadyRunning = timers[recipientUser].running;

      if (!isCoolingDown && !isRecipientAlreadyRunning && WORKER_URL && !WORKER_URL.includes('YOUR_SUBDOMAIN')) {
        startCooldowns[user] = now;
        fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'start',
            senderUser: user,
            senderName: name,
            recipientUser: recipientUser
          })
        }).catch(err => console.error('Start push trigger failed:', err));
      }
    }

    function stop(user) {
      if (!timers[user].running) return;
      const elapsed = Math.max(0, getServerNow() - timers[user].start);
      db.ref(`timers/${user}`).set({
        running: false,
        start: 0,
        accumulated: timers[user].accumulated + elapsed
      });
    }

    // Silently updates the leader baseline when a user resets or logs their timer to 0,
    // preventing a false overtake notification while allowing future overtakes to work.
    function syncLeaderAfterZeroing(resetUser) {
      const otherUser = resetUser === 'userA' ? 'userB' : 'userA';
      const otherSec = Math.floor(getCurrentTotal(otherUser) / 1000);
      const nextLeader = otherSec > 0 ? otherUser : 'none';
      db.ref('leader').set(nextLeader);
    }

    function reset(user) {
      db.ref(`timers/${user}`).set({ running: false, start: 0, accumulated: 0 });
      syncLeaderAfterZeroing(user);
    }

    function save(user, name) {
      let total = timers[user].accumulated;
      if (timers[user].running) total += Math.max(0, getServerNow() - timers[user].start);
      if (total <= 0) return;

      db.ref('history').push({
        name: name,
        duration: formatTime(total),
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      db.ref(`timers/${user}`).set({
        running: false,
        start: 0,
        accumulated: 0
      });
      syncLeaderAfterZeroing(user);
    }
  </script>
</body>
</html>
